    <noscript>
      <h1>GreLines — transports en commun de Grenoble en temps réel</h1>
      <p>
        GreLines affiche les prochains passages en temps réel à chaque arrêt de
        Grenoble et de sa métropole : les trams A, B, C, D et E, les lignes
        Chrono, Proximo et Flexo du réseau Tag (M réso / SMMAG), les TER de la
        gare de Grenoble, ainsi que les véhicules en libre-service Citiz et Voi.
      </p>
      <p>
        L'application calcule aussi vos itinéraires, publie l'info-trafic ligne
        par ligne, les fiches horaires et un plan interactif du réseau. Elle est
        gratuite, sans compte et sans publicité.
      </p>
      <p>
        Cette application a besoin de JavaScript pour fonctionner. Le code
        source est disponible sur
        <a href="https://github.com/antquu/GreLines">github.com/antquu/GreLines</a>.
      </p>
    </noscript>
