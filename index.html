    <link rel="icon" type="image/png" href="/flavicon.png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/flavicon.png" />
    <!-- Pas d'agrandissement : un double-tap malencontreux sur la liste des
         itinéraires zoomait la page entière, et l'on se retrouvait à la faire
         glisser dans tous les sens sans comprendre d'où venait ce cadrage. Les
         champs sont déjà à 16 px, taille en dessous de laquelle iOS zoome de
         lui-même à la saisie ; il ne restait que le geste. La carte, elle, gère
         son propre pincement : c'est MapLibre qui l'écoute, pas le navigateur. -->
    <!-- `viewport-fit=cover` : la page va jusqu'aux bords de l'écran, encoche
         comprise. Sans lui, une application installée sur un téléphone à
         encoche est mise en boîte — le système remplit les zones sûres d'une
         bande unie, et `env(safe-area-inset-*)` vaut zéro partout. Les seize
         écrans qui réservent déjà cette marge en haut, et la feuille qui la
         mesure en bas, travaillaient donc dans le vide.

         Avec lui, la carte passe sous l'encoche — ce qu'on veut d'une carte —
         et ce sont ces marges-là qui gardent les titres et les boutons à
         l'écart. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Horaires en temps réel des transports de Grenoble (Tag, TER, Citiz) \ GreLines</title>
    <meta
      name="description"
      content="Prochains passages en temps réel à chaque arrêt de Grenoble et de sa métropole : trams A à E, Chrono, Proximo, Flexo, TER, bus Tag. Itinéraires, info-trafic, fiches horaires, plan interactif et véhicules en libre-service. Gratuit, sans compte et sans publicité."
    />
    <link rel="canonical" href="https://www.grelines.fr/" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />
    <meta name="author" content="Antoine ADAM" />
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="apple-mobile-web-app-title" content="GreLines" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- La barre d'état par-dessus la carte, et non à côté.

         Sans ce réglage, iOS réserve la hauteur de l'encoche à la barre d'état
         et la peint en noir : c'est la bande qu'on voyait au-dessus de la
         carte, avec l'heure et la batterie posées dessus. « black-translucent »
         la rend transparente et laisse la page passer dessous — la carte
         remonte jusqu'au bord de l'écran, l'heure et les icônes se détachent
         par-dessus en blanc.

         Les écrans qui ont du texte en haut gardent leur marge :
         `env(safe-area-inset-top)`, qui devient enfin non nulle, les tient à
         l'écart de l'encoche. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <meta

    />

  <body>
    <div id="root"></div>

    <noscript>
      <h1>GreLines — transports en commun de Grenoble en temps réel</h1>
      <p>
        GreLines affiche les prochains passages en temps réel à chaque arrêt de
        Grenoble et de sa métropole : les trams A, B, C, D et E, les lignes
        Chrono, Proximo et Flexo du réseau Tag (M réso / SMMAG), les TER de la
        gare de Grenoble, ainsi que les véhicules en libre-service Citiz et Voi.
      </p>
      <p>
        L'application calcule aussi vos itinéraires, publie l'info-trafic ligne
        par ligne, les fiches horaires et un plan interactif du réseau. Elle est
        gratuite, sans compte et sans publicité.
      </p>
      <p>
        Cette application a besoin de JavaScript pour fonctionner. Le code
        source est disponible sur
        <a href="https://github.com/antquu/GreLines">github.com/antquu/GreLines</a>.
      </p>
    </noscript>
