    <noscript>
      <h1>GreLines : transports en commun de Clermont-Ferrand en temps réel</h1>
      <p>
        GreLines affiche les prochains passages en temps réel à chaque arrêt de
        Clermont-Ferrand et de sa métropole : tram A et bus T2C, ainsi que les trains TER.
      </p>
      <p>
        L'application calcule aussi vos itinéraires, publie l'info-trafic ligne
        par ligne, les fiches horaires et un plan interactif du réseau. Elle est
        gratuite, sans compte et sans publicité.
      </p>
      <p>Cette application a besoin de JavaScript pour fonctionner.</p>
    </noscript>
